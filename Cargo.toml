[package]
name = "breeze-mock"
version = "1.0.1"
edition = "2021"
description = "Mock Breeze Core servers and emulated Midea air conditioners, described in XML, for testing and debugging"
license = "AGPL-3.0-or-later"
repository = "https://github.com/monikapurpl3/breeze-mock"
publish = false

# The protocol, auth and control-validation code is Breeze Core's own, pinned
# to a release: an emulated unit is only worth testing against if it speaks
# exactly what Breeze Core expects, and copying the codecs here would let the
# two drift apart the first time either changed.
[dependencies]
breeze-proto = { git = "https://github.com/monikapurpl3/breeze-core-native", tag = "v4.3.2" }
breeze-auth = { git = "https://github.com/monikapurpl3/breeze-core-native", tag = "v4.3.2" }
breeze-store = { git = "https://github.com/monikapurpl3/breeze-core-native", tag = "v4.3.2" }
# A mock server is Breeze Core's own HTTP layer, unmodified, in front of the
# emulated units: pairing, timers, the scheduler, the stream and every response
# shape are the real ones because they are the real code. breeze-mock adds
# only what a mock is for, in front of it (src/api/). Without the `cloud`
# feature: a mock must never reach Midea, so a request carrying cloud
# credentials gets the 501 a router build of Breeze Core gives.
breeze-http = { git = "https://github.com/monikapurpl3/breeze-core-native", tag = "v4.3.2", default-features = false }
breeze-device = { git = "https://github.com/monikapurpl3/breeze-core-native", tag = "v4.3.2" }

# Blueprints. A read-only DOM with node positions, so every error names the
# line and column it came from.
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.10"
getrandom = "0.2"
# SO_REUSEADDR and SO_BROADCAST for the discovery sockets; std offers neither.
socket2 = "0.5"
# TLS for mock domains, with a certificate per hostname chosen by SNI. ring
# rather than aws-lc-rs, which needs cmake and a C toolchain per target.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
# Clean up dummy interfaces and address aliases on Ctrl-C and SIGTERM, which
# is how systemd stops a service. Held at 3.4: 3.5 links Objective-C and
# Foundation on macOS, which zig (the macOS cross-linker here) does not have.
ctrlc = { version = "~3.4", features = ["termination"] }

[dev-dependencies]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
